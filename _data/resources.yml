- title: "THINGS-Mooney database"
  featured: true
  type: "Datasets & code"
  tags: ["open science"]
  description: >-
    A set of "mooney-style" distorted images created from the original license-free THINGS-plus
    images, plus a toolbox to create your own mooney-style images and subjective recognition scores
    collected on a large sample of participants (n = 947).
  image: "/assets/img/output.gif"
  links:
    - label: "Repository"
      url: "https://github.com/wobc/things-mooney"
      icon: "fa-code"
    - label: "THINGS-plus images"
      url: "https://osf.io/jum2f/"
      icon: "fa-images"
  citation: >-
    Linde-Domingo, J.*, Ortiz-Tudela, J.*, Voeller, J., & González-García, C. (2024). THINGS-Mooney
